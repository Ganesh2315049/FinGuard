spring.application.name=finguard
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/finguard}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
server.port=${PORT:8080}
finguard.jwt.secret=${JWT_SECRET:change-this-development-secret-key-to-at-least-32-characters}
finguard.frontend-url=${FRONTEND_URL:http://localhost:5173}
finguard.demo-seed=${DEMO_SEED:false}
finguard.demo-password=${DEMO_PASSWORD:}
finguard.demo-admin-email=${DEMO_ADMIN_EMAIL:ganeshbavana26@gmail.com}
finguard.demo-admin-password=${DEMO_ADMIN_PASSWORD:}
finguard.demo-admin-enabled=${DEMO_ADMIN_ENABLED:false}
springdoc.swagger-ui.path=/swagger-ui.html
